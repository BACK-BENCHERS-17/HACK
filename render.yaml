services:
  - type: web
    name: hack-store-bot
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: hack_store_enterprise
      - key: DEFAULT_UPI_ID
        sync: false
      - key: DEFAULT_PAYEE_NAME
        value: Hack Store
      - key: IMAP_USERNAME
        sync: false
      - key: IMAP_APP_PASSWORD
        sync: false
      - key: IMAP_HOST
        value: imap.gmail.com
      - key: IMAP_PORT
        value: "993"
      - key: IMAP_MAILBOX
        value: INBOX
      - key: IMAP_SENDER_FILTER
        value: fam
      - key: GMAIL_LOOKBACK_HOURS
        value: "12"
      - key: ORDER_EXPIRY_MINUTES
        value: "15"
